name: deploy-staging
on:
  push:
    branches: [staging]
  workflow_dispatch:
concurrency:
  group: deploy-staging
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build image
        run: docker build --target prod -t ghcr.io/${{ github.repository }}:${{ github.sha }} -t ghcr.io/${{ github.repository }}:latest .
      - name: Push image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }} && docker push ghcr.io/${{ github.repository }}:latest
      - name: Deploy
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cp /opt/da-server/check-in/.env .env
          docker compose -f compose.staging.yaml up -d --remove-orphans
          docker compose -f compose.staging.yaml run --rm checkin php artisan migrate:status 2>/dev/null | grep -q "Ran" || SEED_DB=true
          docker compose -f compose.staging.yaml run --rm checkin php artisan migrate --force
          if [ "${SEED_DB:-false}" = "true" ]; then
            docker compose -f compose.staging.yaml run --rm checkin php artisan db:seed --force
          fi
          docker compose -f compose.staging.yaml exec -T checkin php artisan optimize
          docker compose -f compose.staging.yaml exec -T checkin php artisan octane:reload

